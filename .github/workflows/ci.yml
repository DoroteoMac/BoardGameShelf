name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore BoardGameShelf.sln

      - name: Build
        run: dotnet build BoardGameShelf.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test BoardGameShelf.sln --no-build --configuration Release --verbosity normal
